<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1c" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>
    <radialGradient id="glow-lens" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.35)" />
      <stop offset="60%" stop-color="rgba(59, 130, 246, 0.1)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="glow-warm" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.2)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-lens)" />
  <rect width="1280" height="720" fill="url(#glow-lens)" />
  <rect width="1280" height="720" fill="url(#glow-warm)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180" stroke-dasharray="4 8" />
    <line x1="0" y1="360" x2="1280" y2="360" stroke-dasharray="4 8" />
    <line x1="0" y1="540" x2="1280" y2="540" stroke-dasharray="4 8" />
    <line x1="320" y1="0" x2="320" y2="720" stroke-dasharray="4 8" />
    <line x1="640" y1="0" x2="640" y2="720" stroke-dasharray="4 8" />
    <line x1="960" y1="0" x2="960" y2="720" stroke-dasharray="4 8" />
  </g>

  <!-- Top Cinematic Metadata Bar -->
  <g transform="translate(80, 60)">
    <rect width="140" height="32" rx="16" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#06b6d4" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">LENSCRAFT</text>
    <text x="170" y="21" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#64748b" letter-spacing="1">AI CINEMATIC STORYBOARD STUDIO • 24.00 FPS • 8K RAW</text>
  </g>

  <!-- Central Camera Aperture & Focus Ring Graphics -->
  <g transform="translate(640, 310)">
    <circle cx="0" cy="0" r="220" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="10 15" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#accent-cyan)" stroke-width="2" opacity="0.6" filter="url(#glow-subtle)" />
    
    <line x1="-180" y1="0" x2="-130" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <line x1="130" y1="0" x2="180" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="-180" x2="0" y2="-130" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="130" x2="0" y2="180" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />

    <circle cx="0" cy="0" r="55" fill="#0b1329" stroke="#38bdf8" stroke-width="2" />
    <polygon points="0,-40 35,20 -35,20" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
    <polygon points="0,40 -35,-20 35,-20" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="url(#accent-cyan)" filter="url(#glow-subtle)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Left Floating Storyboard Card (Script Asset) -->
  <g transform="translate(110, 160)">
    <rect width="280" height="360" rx="24" fill="url(#glass-card)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <rect x="20" y="20" width="80" height="22" rx="11" fill="rgba(6, 182, 212, 0.2)" />
    <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">剧本解析</text>
    
    <rect x="20" y="60" width="180" height="8" rx="4" fill="rgba(255, 255, 255, 0.7)" />
    <rect x="20" y="78" width="240" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="20" y="92" width="210" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="20" y="106" width="150" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />

    <g transform="translate(20, 135)">
      <rect width="115" height="24" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#93c5fd">Lens: Anamorphic</text>
      
      <rect x="125" width="115" height="24" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <text x="135" y="16" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#fcd34d">Mood: Cyberpunk</text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="240" height="155" rx="16" fill="#0a0f1d" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <!-- Movie film strip path graphic -->
      <path d="M20 270 Q 80 210, 120 250 T 220 200" fill="none" stroke="url(#accent-cyan)" stroke-width="3" />
      <circle cx="60" cy="228" r="5" fill="#38bdf8" filter="url(#glow-subtle)" />
      <circle cx="120" cy="250" r="5" fill="#38bdf8" filter="url(#glow-subtle)" />
      <circle cx="180" cy="215" r="5" fill="#f59e0b" filter="url(#glow-subtle)" />
      <text x="120" y="315" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">分镜资产自动拆解中...</text>
    </g>
  </g>

  <!-- Right Floating Storyboard Card (Prompt Engine) -->
  <g transform="translate(890, 160)">
    <rect width="280" height="360" rx="24" fill="url(#glass-card)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <rect x="20" y="20" width="95" height="22" rx="11" fill="rgba(245, 158, 11, 0.2)" />
    <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">分镜提示词</text>

    <g transform="translate(20, 55)">
      <rect width="240" height="80" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="12" y="24" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">/imagine prompt: cinematic</text>
      <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">cyberpunk neon alley, 35mm,</text>
      <text x="12" y="64" font-family="ui-monospace, monospace" font-size="10" fill="#f59e0b">volumetric lighting --ar 16:9</text>
    </g>

    <!-- Visual Storyboard Sequence 3 mini thumbnails -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="72" height="95" rx="10" fill="#0d1527" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <text x="36" y="85" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">SHOT #1</text>
      
      <rect x="84" y="0" width="72" height="95" rx="10" fill="#0d1527" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
      <text x="120" y="85" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">SHOT #2</text>

      <rect x="168" y="0" width="72" height="95" rx="10" fill="#0d1527" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <text x="204" y="85" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">SHOT #3</text>
    </g>

    <g transform="translate(20, 265)">
      <rect width="240" height="75" rx="14" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
      <circle cx="28" cy="38" r="12" fill="#06b6d4" />
      <polygon points="26,32 34,38 26,44" fill="#ffffff" />
      <text x="52" y="33" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">一键生成影视资产包</text>
      <text x="52" y="53" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">支持 Midjourney &amp; SD 导出</text>
    </g>
  </g>

  <!-- Bottom Title and Description -->
  <g transform="translate(640, 610)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      镜头工坊 LensCraft
    </text>
    <text y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      输入剧本通过 AI 生成影视资产与专业分镜提示词
    </text>
  </g>
</svg>
